<div id="bez-lounge-hero" aria-label="Первый экран: интерьер и озеленение">
<style>
#bez-lounge-hero{--paper:#f3f0e9;--ink:#20211d;--accent:#ac3d2e;background:var(--paper);color:var(--ink);font-family:Arial,sans-serif;padding:28px 34px 22px;box-sizing:border-box}
#bez-lounge-hero *{box-sizing:border-box}
#bez-lounge-hero header{display:flex;align-items:center;justify-content:space-between;gap:28px;padding-bottom:24px;border-bottom:1px solid #ccc7bd}
#bez-lounge-hero .bh-logo{width:185px;height:auto;display:block}
#bez-lounge-hero a{color:inherit}
#bez-lounge-hero header a{font-size:13px;text-decoration:none;min-height:44px;display:inline-flex;align-items:center}
#bez-lounge-hero .bh-grid{display:grid;grid-template-columns:minmax(0,.95fr) minmax(0,1.05fr);gap:34px;padding-top:36px;align-items:start}
#bez-lounge-hero .bh-copy{padding:0}
#bez-lounge-hero .bh-eyebrow{font:11px/1.6 Arial,sans-serif;letter-spacing:1.4px;text-transform:uppercase;margin:0 0 48px;max-width:240px}
#bez-lounge-hero h1{font:400 clamp(42px,6vw,68px)/1.02 Arial,sans-serif;letter-spacing:-2.7px;margin:0}
#bez-lounge-hero h1 span{color:var(--accent)}
#bez-lounge-hero .bh-lead{font:19px/1.45 Georgia,serif;max-width:310px;margin:26px 0 30px}
#bez-lounge-hero .bh-actions{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
#bez-lounge-hero .bh-button{position:relative;isolation:isolate;display:inline-block;border:0;padding:0;margin:0;font:italic 400 26px Georgia,serif;width:175px;height:120px;color:var(--ink);background:none;flex:none}
#bez-lounge-hero .bh-button::before,#bez-lounge-hero .bh-button::after{position:absolute;top:0;left:0;width:100%;height:100%}
#bez-lounge-hero .bh-button::before{content:'';background:#e3dfd3;clip-path:path("M154.5,88.5 C131,113.5 62.5,110 30,89.5 C-2.5,69 -3.5,42 4.5,25.5 C12.5,9 33.5,-6 85,3.5 C136.5,13 178,63.5 154.5,88.5 Z");transition:clip-path .5s cubic-bezier(.585,2.5,.645,.55),background .5s ease}
#bez-lounge-hero .bh-button:is(:hover,:focus-visible)::before{background:var(--accent);clip-path:path("M143,77 C117,96 74,100.5 45.5,91.5 C17,82.5 -10.5,57 5.5,31.5 C21.5,6 79,-5.5 130.5,4 C182,13.5 169,58 143,77 Z")}
#bez-lounge-hero .bh-button::after{content:'';height:86%;width:97%;top:5%;border-radius:58% 42% 55% 45% / 56% 45% 55% 44%;border:1px solid var(--accent);transform:rotate(-20deg);z-index:-1;transition:transform .5s cubic-bezier(.585,2.5,.645,.55)}
#bez-lounge-hero .bh-button:is(:hover,:focus-visible)::after{transform:translateY(-5px)}
#bez-lounge-hero .bh-button span{position:relative;display:block;transition:transform .3s,color .3s}
#bez-lounge-hero .bh-button:is(:hover,:focus-visible) span{transform:translateY(-10px);color:#f3f0e9}
#bez-lounge-hero .bh-work{font:13px/1.5 Arial,sans-serif;text-decoration:none;min-height:44px;display:inline-flex;align-items:center;gap:12px;border-bottom:1px solid #a29d92}
#bez-lounge-hero figure{margin:0;min-width:0;padding-top:108px}
#bez-lounge-hero .bh-photo{display:block;width:100%;aspect-ratio:4/5;object-fit:cover;background:#727772}
#bez-lounge-hero figcaption{display:flex;justify-content:space-between;gap:14px;font:11px/1.5 Arial,sans-serif;margin-top:12px;color:#595b54}
#bez-lounge-hero .bh-contact{border-top:1px solid #ccc7bd;margin-top:24px;padding-top:20px}
#bez-lounge-hero .bh-contact p{font:18px/1.4 Georgia,serif;margin:0 0 12px}
#bez-lounge-hero .bh-contact a{display:inline-flex;align-items:center;min-height:44px;font-size:21px;text-decoration:none}
#bez-lounge-hero [hidden]{display:none!important}
@media(max-width:720px){#bez-lounge-hero figure{padding-top:0}#bez-lounge-hero{padding:22px}#bez-lounge-hero .bh-grid{grid-template-columns:1fr;gap:24px}#bez-lounge-hero .bh-copy{padding:4px 0 0}#bez-lounge-hero h1{font-size:clamp(40px,8vw,58px);letter-spacing:-1.9px}#bez-lounge-hero .bh-eyebrow{margin-bottom:22px;max-width:none}#bez-lounge-hero .bh-lead{max-width:370px;margin:22px 0}#bez-lounge-hero .bh-actions{gap:26px}#bez-lounge-hero .bh-photo{aspect-ratio:5/4;object-position:50% 57%}#bez-lounge-hero header{padding-bottom:16px}#bez-lounge-hero .bh-logo{width:155px}}
@media(max-width:380px){#bez-lounge-hero{padding:18px}#bez-lounge-hero .bh-actions{gap:8px}#bez-lounge-hero header{gap:12px}#bez-lounge-hero header a{font-size:12px}#bez-lounge-hero .bh-logo{width:145px}#bez-lounge-hero .bh-work{font-size:12px}}
@media(prefers-reduced-motion:reduce){#bez-lounge-hero *,#bez-lounge-hero *::before,#bez-lounge-hero *::after{transition:none!important}}
</style>
