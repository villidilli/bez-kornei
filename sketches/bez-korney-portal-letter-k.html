<style>
#portal-letter-k .portal-specimen{
  --portal-bg:#171716;--portal-ink:#efebe3;--portal-red:#ff593e;
  background:var(--portal-bg);color:var(--portal-ink);padding:clamp(16px,4vw,30px);font:14px/1.4 Arial,sans-serif;
}
#portal-letter-k .specimen-stage{min-height:clamp(160px,30vw,235px);display:grid;place-items:center}
#portal-letter-k .main-logo{display:block;width:min(100%,590px);overflow:visible}
#portal-letter-k .specimen-controls,#portal-letter-k .specimen-header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
#portal-letter-k .specimen-header{margin-top:18px;padding-top:12px;border-top:1px solid #efebe355}
#portal-letter-k .specimen-header span{font-size:12px}
#portal-letter-k .mini-logo{width:150px;display:block}
#portal-letter-k button{min-height:44px;color:inherit;background:transparent;border:1px solid currentColor;padding:8px 12px;font:inherit}
#portal-letter-k button span{margin-left:9px}
#portal-letter-k .k-arms { transform-origin:2px 25px; }
#portal-letter-k .letter-k { transform-origin:2px 48px; }
#portal-letter-k .is-playing .main-logo .letter-k { animation: k-arrive 1.65s cubic-bezier(.35,.05,.25,1) both; }
#portal-letter-k .is-playing .main-logo .k-stem { animation: k-line 1.65s cubic-bezier(.35,.05,.25,1) both; }
#portal-letter-k .is-playing .main-logo .k-arms { animation: k-unfold 1.65s cubic-bezier(.35,.05,.25,1) both; }
@keyframes k-arrive {
  0%,8% { transform:translateX(-10.5px) rotate(0deg); }
  28% { transform:translateX(1px) rotate(-15deg); }
  43% { transform:translateX(1px) rotate(-15deg); }
  67% { transform:translateX(0) rotate(15deg); }
  84% { transform:translateX(0) rotate(-3deg); }
  94%,100% { transform:translateX(0) rotate(0deg); }
}
@keyframes k-line {
  0%,8% { d:path("M2 -6V52"); stroke-width:1.8; }
  43%,100% { d:path("M2 0V48"); stroke-width:3.4; }
}
@keyframes k-unfold {
  0%,8% { opacity:0; transform:scaleX(0); }
  18% { opacity:1; }
  43%,100% { opacity:1; transform:scaleX(1); }
}
@media(max-width:460px){#portal-letter-k .specimen-controls{align-items:flex-start;flex-direction:column}}
@media(prefers-reduced-motion:reduce){#portal-letter-k .main-logo *{animation:none!important;transition:none!important}}
</style>
<script>
(() => {
  const root = document.getElementById('portal-letter-k');
  const specimen = root.querySelector('.portal-specimen');
  const button = root.querySelector('button');
  button.addEventListener('click', () => {
    specimen.classList.remove('is-playing');
    void specimen.offsetWidth;
    specimen.classList.add('is-playing');
    button.firstChild.textContent = 'Повторить превращение ';
  });
})();
</script>
