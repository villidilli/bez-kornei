<style>
#bez-lounge-hero{--paper:#f3f0e9;--ink:#20211d;--accent:#ac3d2e;background:var(--paper);color:var(--ink);font-family:Arial,sans-serif;padding:28px 34px 22px;box-sizing:border-box}
#bez-lounge-hero *{box-sizing:border-box}
#bez-lounge-hero header{display:flex;align-items:center;justify-content:space-between;gap:28px;padding-bottom:24px;border-bottom:1px solid #ccc7bd}
#bez-lounge-hero .bh-logo{width:185px;height:auto;display:block}
#bez-lounge-hero a{color:inherit}
#bez-lounge-hero header a{font-size:13px;text-decoration:none;min-height:44px;display:inline-flex;align-items:center}
#bez-lounge-hero .bh-grid{display:grid;grid-template-columns:minmax(0,.95fr) minmax(0,1.05fr);gap:34px;padding-top:36px;align-items:start}
#bez-lounge-hero .bh-copy{padding:0}
#bez-lounge-hero .bh-eyebrow{font:11px/1.6 Arial,sans-serif;letter-spacing:1.4px;text-transform:uppercase;margin:0 0 48px;max-width:240px}
#bez-lounge-hero h1{font:400 clamp(42px,6vw,68px)/1.02 Arial,sans-serif;letter-spacing:-2.7px;margin:0}
#bez-lounge-hero h1 span{color:var(--accent)}
#bez-lounge-hero .bh-lead{font:19px/1.45 Georgia,serif;max-width:310px;margin:26px 0 30px}
#bez-lounge-hero .bh-actions{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
#bez-lounge-hero .bh-button{position:relative;isolation:isolate;display:inline-block;border:0;padding:0;margin:0;font:italic 400 26px Georgia,serif;width:175px;height:120px;color:var(--ink);background:none;flex:none}
#bez-lounge-hero .bh-button::before,#bez-lounge-hero .bh-button::after{position:absolute;top:0;left:0;width:100%;height:100%}
#bez-lounge-hero .bh-button::before{content:'';background:#e3dfd3;clip-path:path("M154.5,88.5 C131,113.5 62.5,110 30,89.5 C-2.5,69 -3.5,42 4.5,25.5 C12.5,9 33.5,-6 85,3.5 C136.5,13 178,63.5 154.5,88.5 Z");transition:clip-path .5s cubic-bezier(.585,2.5,.645,.55),background .5s ease}
#bez-lounge-hero .bh-button:is(:hover,:focus-visible)::before{background:var(--accent);clip-path:path("M143,77 C117,96 74,100.5 45.5,91.5 C17,82.5 -10.5,57 5.5,31.5 C21.5,6 79,-5.5 130.5,4 C182,13.5 169,58 143,77 Z")}
#bez-lounge-hero .bh-button::after{content:'';height:86%;width:97%;top:5%;border-radius:58% 42% 55% 45% / 56% 45% 55% 44%;border:1px solid var(--accent);transform:rotate(-20deg);z-index:-1;transition:transform .5s cubic-bezier(.585,2.5,.645,.55)}
#bez-lounge-hero .bh-button:is(:hover,:focus-visible)::after{transform:translateY(-5px)}
#bez-lounge-hero .bh-button span{position:relative;display:block;transition:transform .3s,color .3s}
#bez-lounge-hero .bh-button:is(:hover,:focus-visible) span{transform:translateY(-10px);color:#f3f0e9}
#bez-lounge-hero .bh-work{font:13px/1.5 Arial,sans-serif;text-decoration:none;min-height:44px;display:inline-flex;align-items:center;gap:12px;border-bottom:1px solid #a29d92}
#bez-lounge-hero figure{margin:0;min-width:0;padding-top:108px}
#bez-lounge-hero .bh-photo{display:block;width:100%;aspect-ratio:4/5;object-fit:cover;background:#727772}
#bez-lounge-hero figcaption{display:flex;justify-content:space-between;gap:14px;font:11px/1.5 Arial,sans-serif;margin-top:12px;color:#595b54}



#bez-lounge-hero [hidden]{display:none!important}
@media(max-width:720px){#bez-lounge-hero figure{padding-top:0}#bez-lounge-hero{padding:22px}#bez-lounge-hero .bh-grid{grid-template-columns:1fr;gap:24px}#bez-lounge-hero .bh-copy{padding:4px 0 0}#bez-lounge-hero h1{font-size:clamp(40px,8vw,58px);letter-spacing:-1.9px}#bez-lounge-hero .bh-eyebrow{margin-bottom:22px;max-width:none}#bez-lounge-hero .bh-lead{max-width:370px;margin:22px 0}#bez-lounge-hero .bh-actions{gap:26px}#bez-lounge-hero .bh-photo{aspect-ratio:5/4;object-position:50% 57%}#bez-lounge-hero header{padding-bottom:16px}#bez-lounge-hero .bh-logo{width:155px}}
@media(max-width:380px){#bez-lounge-hero{padding:18px}#bez-lounge-hero .bh-actions{gap:8px}#bez-lounge-hero header{gap:12px}#bez-lounge-hero header a{font-size:12px}#bez-lounge-hero .bh-logo{width:145px}#bez-lounge-hero .bh-work{font-size:12px}}
@media(prefers-reduced-motion:reduce){#bez-lounge-hero *,#bez-lounge-hero *::before,#bez-lounge-hero *::after{transition:none!important}}
</style>

<style>
/* Split-screen editorial cover. Motion study, not a filmed completed project. */
#page-content{max-width:none}
#page-content #bez-lounge-hero{padding:0;background:#f3f0e9}
#page-content #bez-lounge-hero header{height:82px;padding:0 38px;border-bottom:1px solid #ccc7bd}
#page-content #bez-lounge-hero .bh-logo{width:185px}
#page-content #bez-lounge-hero .bh-grid{grid-template-columns:54% 46%;gap:0;padding:0;min-height:calc(100svh - 82px);align-items:stretch}
#page-content #bez-lounge-hero .bh-copy{grid-column:2;grid-row:1;padding:48px clamp(30px,4vw,76px) 42px;display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-start;min-width:0}
#page-content #bez-lounge-hero .bh-eyebrow{margin:0;text-align:right;font-size:10px;letter-spacing:1.5px;max-width:245px}
#page-content #bez-lounge-hero h1{font-size:clamp(44px,4.9vw,78px);line-height:1.04;letter-spacing:-2.3px}
#page-content #bez-lounge-hero .bh-lead{font-size:clamp(17px,1.65vw,22px);line-height:1.45;max-width:330px;margin:30px 0 28px}
#page-content #bez-lounge-hero .bh-actions{gap:22px;margin-top:auto;padding-top:20px}
#page-content #bez-lounge-hero .bh-button{width:175px;height:120px}
#page-content #bez-lounge-hero .bh-work{font-size:12px}
#page-content #bez-lounge-hero .bh-scene{position:relative;grid-column:1;grid-row:1;margin:0;padding:0;overflow:hidden;min-height:640px;background:#70716a}
#page-content #bez-lounge-hero .bh-photo,#page-content #bez-lounge-hero .bh-motion{position:absolute;inset:0;width:100%;height:100%;max-height:none;object-fit:cover;object-position:center;aspect-ratio:auto;display:block}
#page-content #bez-lounge-hero .bh-motion{opacity:0;transition:opacity .4s;pointer-events:none}
#page-content #bez-lounge-hero .bh-scene.is-ready .bh-motion{opacity:1}
#page-content #bez-lounge-hero .bh-motion-toggle{position:absolute;bottom:24px;left:28px;z-index:2;display:none;align-items:center;gap:10px;min-height:44px;background:rgba(32,33,29,.55);border:1px solid rgba(255,255,255,.45);border-radius:24px;color:#fff;padding:0 17px;font:11px Arial,sans-serif;cursor:pointer;backdrop-filter:blur(8px)}
#page-content #bez-lounge-hero .bh-scene.is-ready .bh-motion-toggle{display:inline-flex}

@media(min-width:721px) and (max-width:1000px){#page-content #bez-lounge-hero .bh-grid{grid-template-columns:50% 50%}#page-content #bez-lounge-hero .bh-copy{padding:30px 28px}#page-content #bez-lounge-hero h1{font-size:44px;letter-spacing:-1.8px}#page-content #bez-lounge-hero .bh-actions{gap:10px}}
@media(max-width:720px){#page-content #bez-lounge-hero header{height:70px;padding:0 22px}#page-content #bez-lounge-hero .bh-logo{width:140px}#page-content #bez-lounge-hero .bh-grid{display:flex;flex-direction:column;min-height:0}#page-content #bez-lounge-hero .bh-copy{padding:34px 22px 32px}#page-content #bez-lounge-hero .bh-eyebrow{margin:0;font-size:8px;line-height:1.6;letter-spacing:.8px;max-width:155px}#page-content #bez-lounge-hero h1{font-size:clamp(42px,8.8vw,64px);letter-spacing:-1.8px}#page-content #bez-lounge-hero .bh-lead{margin:24px 0 12px;max-width:340px;font-size:19px}#page-content #bez-lounge-hero .bh-actions{padding-top:8px;gap:18px}#page-content #bez-lounge-hero .bh-scene{min-height:0;height:78svh;max-height:800px}#page-content #bez-lounge-hero .bh-motion-toggle{bottom:18px;left:22px}}
@media(prefers-reduced-motion:reduce){#page-content #bez-lounge-hero .bh-motion{display:none}#page-content #bez-lounge-hero .bh-motion-toggle{display:none!important}}

<style>
#page-content #bez-lounge-hero .bh-scene.has-light::before,#page-content #bez-lounge-hero .bh-scene.has-light::after{content:'';position:absolute;inset:-16%;pointer-events:none;z-index:1;transform-origin:center;animation:bh-sunlight 9s ease-in-out infinite alternate}
#page-content #bez-lounge-hero .bh-scene.has-light::before{background:linear-gradient(118deg,transparent 24%,#fff4ce00 30%,#fff4ce55 34%,#fff9e390 37%,#fff1c500 41%,transparent 45%,#fff4ce40 49%,transparent 54%);mix-blend-mode:screen;opacity:.28}
#page-content #bez-lounge-hero .bh-scene.has-light::after{background:radial-gradient(ellipse 16% 7% at 42% 48%,#14251438,transparent 75%),radial-gradient(ellipse 8% 17% at 59% 45%,#14251430,transparent 75%),radial-gradient(ellipse 22% 8% at 70% 58%,#15261132,transparent 75%);mix-blend-mode:multiply;opacity:.35;animation-name:bh-leaf-shade;animation-duration:12s}
