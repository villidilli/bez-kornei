<style>
#portal-studio-refined .portal-specimen{
  --portal-bg:#171716;--portal-ink:#efebe3;--portal-red:#ff593e;
  background:var(--portal-bg);color:var(--portal-ink);padding:clamp(16px,4vw,30px);font:14px/1.4 Arial,sans-serif;
}
#portal-studio-refined .specimen-stage{min-height:clamp(160px,30vw,235px);display:grid;place-items:center}
#portal-studio-refined .main-logo{display:block;width:min(100%,590px);overflow:visible}
#portal-studio-refined .specimen-controls,#portal-studio-refined .specimen-header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
#portal-studio-refined .specimen-header{margin-top:18px;padding-top:12px;border-top:1px solid #efebe355}
#portal-studio-refined .specimen-header span{font-size:12px}
#portal-studio-refined .mini-logo{width:150px;display:block}
#portal-studio-refined button{min-height:44px;color:inherit;background:transparent;border:1px solid currentColor;padding:8px 12px;font:inherit}
#portal-studio-refined button span{margin-left:9px}
#portal-studio-refined .studio-word{clip-path:inset(0 100% 0 0) stroke-box}
#portal-studio-refined .main-logo .first-word,#portal-studio-refined .main-logo .last-word{transition:transform 750ms cubic-bezier(.25,.1,.25,1)}
#portal-studio-refined .main-logo .divider{transition:opacity 250ms}
#portal-studio-refined .main-logo .studio-word{transition:clip-path 650ms ease}
#portal-studio-refined .is-open .main-logo .first-word{transform:translateX(-14px)}
#portal-studio-refined .is-open .main-logo .last-word{transform:translateX(14px)}
#portal-studio-refined .is-open .main-logo .divider{opacity:0}
#portal-studio-refined .is-open .main-logo .studio-word{clip-path:inset(0) stroke-box;transition-delay:250ms}
@media(max-width:460px){#portal-studio-refined .specimen-controls{align-items:flex-start;flex-direction:column}}
@media(prefers-reduced-motion:reduce){#portal-studio-refined .main-logo *{transition:none!important}}
</style>
<script>
(()=>{
 const root=document.getElementById('portal-studio-refined');
 const specimen=root.querySelector('.portal-specimen');
 const button=root.querySelector('button');
 button.addEventListener('click',()=>{
   const open=specimen.classList.toggle('is-open');
   button.setAttribute('aria-expanded',String(open));
   button.firstChild.textContent=open?'Закрыть проём ':'Открыть проём ';
 });
})();
</script>
