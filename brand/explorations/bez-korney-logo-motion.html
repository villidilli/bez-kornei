<style>
  #bez-lettering-lab .specimen {
    --logo-paper: #f2eee5;
    --logo-ink: #22241e;
    --logo-detail: #8f3a2a;
    padding: clamp(14px, 4vw, 29px);
    color: var(--logo-ink);
    background: var(--logo-paper);
    font: 14px/1.35 Arial, sans-serif;
  }
  #bez-lettering-lab .portal {
    --logo-paper: #22261f;
    --logo-ink: #f3efe5;
    --logo-detail: #bb6b50;
  }
  #bez-lettering-lab .organic {
    --logo-paper: #e8ebe0;
    --logo-ink: #20291f;
    --logo-detail: #7a3428;
  }
  #bez-lettering-lab .specimen-top,
  #bez-lettering-lab .specimen-actions,
  #bez-lettering-lab .specimen-mini {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px 16px;
  }
  #bez-lettering-lab .specimen-mini span { font-size: 12px; }
  #bez-lettering-lab .specimen-art {
    display: grid;
    place-items: center;
    min-height: clamp(135px, 30vw, 223px);
  }
  #bez-lettering-lab .logo-main { display: block; width: min(100%, 590px); overflow: visible; }
  #bez-lettering-lab .specimen-mini {
    border-top: 1px solid color-mix(in srgb, currentColor 30%, transparent);
    margin-top: 16px;
    padding-top: 10px;
  }
  #bez-lettering-lab .logo-mini { width: 135px; display: block; }
  #bez-lettering-lab [data-play] {
    min-height: 44px;
    border: 1px solid currentColor;
    background: transparent;
    color: inherit;
    font: inherit;
    padding: 7px 11px;
  }
  #bez-lettering-lab [data-play] span { padding-left: 7px; }
  #bez-lettering-lab .door { transform: scaleX(.12); transform-box: fill-box; transform-origin: center; }
  #bez-lettering-lab .in-motion.float .logo-main .word-first { animation: bez-float-up 1.5s cubic-bezier(.35,0,.25,1); }
  #bez-lettering-lab .in-motion.float .logo-main .word-last { animation: bez-float-down 1.5s cubic-bezier(.35,0,.25,1); }
  #bez-lettering-lab .in-motion.portal .logo-main .word-first { animation: bez-portal-left 1.65s ease-in-out; }
  #bez-lettering-lab .in-motion.portal .logo-main .word-last { animation: bez-portal-right 1.65s ease-in-out; }
  #bez-lettering-lab .in-motion.portal .logo-main .door { animation: bez-portal-open 1.65s ease-in-out; }
  #bez-lettering-lab .in-motion.organic .logo-main .leaf { animation: bez-leaf-bend 1.4s ease-in-out; }
  @keyframes bez-float-up { 50% { transform: translate(-6px,-15px); } }
  @keyframes bez-float-down { 50% { transform: translate(6px,5px); } }
  @keyframes bez-portal-left { 45%,60% { transform: translateX(-12px); } }
  @keyframes bez-portal-right { 45%,60% { transform: translateX(11px); } }
  @keyframes bez-portal-open { 45%,60% { transform: scaleX(1.65); } }
  @keyframes bez-leaf-bend {
    0%,100% { d: path("M2 0H18C31 0 38 6 36 14 34 23 24 27 2 27"); }
    45% { d: path("M2 0H18C31 -3 40 -12 40 -5 41 13 25 29 2 27"); }
    73% { d: path("M2 0H18C31 1 36 10 34 17 32 25 22 26 2 27"); }
  }
  #bez-lettering-lab .key-pose.float .logo-main .word-first { transform: translate(-6px,-15px); }
  #bez-lettering-lab .key-pose.float .logo-main .word-last { transform: translate(6px,5px); }
  #bez-lettering-lab .key-pose.portal .logo-main .word-first { transform: translateX(-12px); }
  #bez-lettering-lab .key-pose.portal .logo-main .word-last { transform: translateX(11px); }
  #bez-lettering-lab .key-pose.portal .logo-main .door { transform: scaleX(1.65); }
  #bez-lettering-lab .key-pose.organic .logo-main .leaf { d: path("M2 0H18C31 -3 40 -12 40 -5 41 13 25 29 2 27"); }
  @media (max-width: 480px) {
    #bez-lettering-lab .specimen-actions { align-items: flex-start; flex-direction: column; }
    #bez-lettering-lab .specimen-top { padding-right: 65px; }
  }
</style>
<script>
  (() => {
    const root = document.getElementById('bez-lettering-lab');
    const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
    for (const button of root.querySelectorAll('[data-play]')) {
      const specimen = button.closest('.specimen');
      const label = button.firstChild;
      function updateLabel() {
        label.textContent = reducedMotion.matches
          ? (specimen.classList.contains('key-pose') ? 'Вернуть исходный знак ' : 'Показать ключевой кадр ')
          : 'Запустить движение ';
      }
      button.addEventListener('click', () => {
        if (reducedMotion.matches) {
          specimen.classList.toggle('key-pose');
          updateLabel();
          return;
        }
        specimen.classList.remove('in-motion');
        void specimen.offsetWidth;
        specimen.classList.add('in-motion');
      });
      reducedMotion.addEventListener('change', () => {
        specimen.classList.remove('in-motion', 'key-pose');
        updateLabel();
      });
      updateLabel();
    }
  })();
</script>
