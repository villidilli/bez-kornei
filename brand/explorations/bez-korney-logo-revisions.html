<style>
  #bez-lettering-lab .specimen {
    --logo-paper: #f2eee5;
    --logo-ink: #22241e;
    --logo-detail: #8f3a2a;
    padding: clamp(14px, 4vw, 29px);
    color: var(--logo-ink);
    background: var(--logo-paper);
    font: 14px/1.35 Arial, sans-serif;
  }
  #bez-lettering-lab .portal {
    --logo-paper: #171716;
    --logo-ink: #efebe3;
    --logo-detail: #ff593e;
  }
  #bez-lettering-lab .organic {
    --logo-paper: #e8ebe0;
    --logo-ink: #20291f;
    --logo-detail: #7a3428;
  }
  #bez-lettering-lab .specimen-top,
  #bez-lettering-lab .specimen-actions,
  #bez-lettering-lab .specimen-mini {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px 16px;
  }
  #bez-lettering-lab .specimen-mini span { font-size: 12px; }
  #bez-lettering-lab .specimen-art {
    display: grid;
    place-items: center;
    min-height: clamp(135px, 30vw, 223px);
  }
  #bez-lettering-lab .logo-main { display: block; width: min(100%, 590px); overflow: visible; }
  #bez-lettering-lab .specimen-mini {
    border-top: 1px solid color-mix(in srgb, currentColor 30%, transparent);
    margin-top: 16px;
    padding-top: 10px;
  }
  #bez-lettering-lab .logo-mini { width: 135px; display: block; }
  #bez-lettering-lab [data-play] {
    min-height: 44px;
    border: 1px solid currentColor;
    background: transparent;
    color: inherit;
    font: inherit;
    padding: 7px 11px;
  }
  #bez-lettering-lab [data-play] span { padding-left: 7px; }
  #bez-lettering-lab .door { clip-path: inset(0 50%) fill-box; }
  #bez-lettering-lab .leaf-outline { fill: transparent; }
  #bez-lettering-lab .leaf-vein { opacity: 0; }
  #bez-lettering-lab .logo-main :is(.word-first,.word-last,.door,.door-edge,.leaf-stem,.leaf-outline,.leaf-vein) {
    transition: transform 850ms cubic-bezier(.3,.1,.24,1), clip-path 850ms cubic-bezier(.3,.1,.24,1),
      opacity 550ms ease, d 750ms ease-in-out, fill 750ms ease-in-out;
  }
  #bez-lettering-lab .portal.is-open .logo-main .word-first { transform: translateX(-12px); }
  #bez-lettering-lab .portal.is-open .logo-main .word-last { transform: translateX(23px); }
  #bez-lettering-lab .portal.is-open .logo-main .door { clip-path: inset(0) fill-box; }
  #bez-lettering-lab .portal.is-open .logo-main .door-edge { opacity: 0; }
  #bez-lettering-lab .organic.is-open .logo-main .leaf-stem { d: path("M0 50 C4 38 12 27 27 9"); }
  #bez-lettering-lab .organic.is-open .logo-main .leaf-outline {
    d: path("M5 38 C4 16 21 3 36 -2 C37 18 24 36 5 38");
    fill: var(--logo-detail);
  }
  #bez-lettering-lab .organic.is-open .logo-main .leaf-vein { opacity: 1; }
  #bez-lettering-lab .word-letter {
    opacity: 0;
    transform: translateY(4px);
    transition: opacity 240ms ease, transform 350ms ease;
  }
  #bez-lettering-lab .portal.is-open .logo-main .word-letter {
    opacity: 1;
    transform: translateY(0);
    transition-delay: var(--letter-delay);
  }
  @media (max-width: 480px) {
    #bez-lettering-lab .specimen-actions { align-items: flex-start; flex-direction: column; }
  }
  @media (prefers-reduced-motion: reduce) {
    #bez-lettering-lab .logo-main * { transition: none !important; }
  }
</style>
<script>
  (() => {
    const root = document.getElementById('bez-lettering-lab');
    for (const button of root.querySelectorAll('[data-play]')) {
      const specimen = button.closest('.specimen');
      const label = button.firstChild;
      const initialLabel = label.textContent;
      const closingLabel = specimen.classList.contains('portal') ? 'Закрыть проём ' : 'Вернуть букву «Р» ';
      button.setAttribute('aria-expanded', 'false');
      button.addEventListener('click', () => {
        const open = specimen.classList.toggle('is-open');
        button.setAttribute('aria-expanded', String(open));
        label.textContent = open ? closingLabel : initialLabel;
      });
    }
  })();
</script>
